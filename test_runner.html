<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Printer Studio — Testovací Runner Stránek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@500;700&family=Lora:wght@500;700&family=Outfit:wght@500;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/print-engine.css">
  <link rel="stylesheet" href="css/themes.css">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #0ea5e9;
      --success: #10b981;
      --fail: #ef4444;
      --warn: #f59e0b;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 30px 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 1140px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s, background-color 0.15s;
    }
    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.05); }
    .btn-sm {
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
    }
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .stat-val {
      font-size: 28px;
      font-weight: 800;
      margin-top: 4px;
    }
    
    /* Category Filter Tabs */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover {
      border-color: #64748b;
      color: var(--text);
    }
    .filter-btn.active {
      background: rgba(14, 165, 233, 0.15);
      border-color: var(--primary);
      color: #38bdf8;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.15s;
    }
    .test-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .test-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.15s;
    }
    .test-card.pass { border-left: 5px solid var(--success); }
    .test-card.fail { border-left: 5px solid var(--fail); }
    .test-card.running { border-left: 5px solid var(--warn); }
    
    .test-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .test-info {
      flex: 1;
      min-width: 0;
    }
    .test-name {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .test-cat {
      font-size: 10px;
      text-transform: uppercase;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .test-url-link {
      font-size: 12px;
      color: #38bdf8;
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      word-break: break-all;
    }
    .test-url-link:hover {
      text-decoration: underline;
      color: #7dd3fc;
    }
    .test-actions-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .test-status {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-pass { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status-fail { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .status-running { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .status-idle { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); }
    
    /* Compact Visual Style Box */
    .test-styles-preview {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
    }
    .style-swatches-group {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .swatch-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 11px;
    }
    .swatch-box {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25) inset, 0 1px 2px rgba(0, 0, 0, 0.4);
      display: inline-block;
      flex-shrink: 0;
    }
    .font-previews-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .font-sample-pill {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      max-width: 280px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    .font-sample-badge {
      background: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .font-sample-text {
      font-weight: 600;
      color: #f1f5f9;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meta-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 600;
      color: #cbd5e1;
    }

    /* Responsive Media Queries */
    @media (max-width: 900px) {
      .summary-cards {
        grid-template-columns: repeat(2, 1fr);
      }
      .header {
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
      }
      .header > div:last-child {
        display: flex;
        flex-wrap: wrap;
      }
    }
    @media (max-width: 640px) {
      body {
        padding: 16px 12px;
      }
      .summary-cards {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .stat-card {
        padding: 12px;
      }
      .stat-val {
        font-size: 22px;
      }
      .test-header-row {
        flex-direction: column;
        gap: 10px;
      }
      .test-actions-col {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }
      .test-styles-preview {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .style-swatches-group,
      .font-previews-group {
        width: 100%;
      }
    }

    .test-log-output {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: #060a12;
      padding: 10px 14px;
      border-radius: 6px;
      color: #94a3b8;
      white-space: pre-wrap;
      border: 1px solid #1e293b;
      display: none;
    }
    .test-log-output.show { display: block; }
    .test-details-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
      align-self: flex-start;
    }
    .test-details-btn:hover { color: #38bdf8; }
    
    /* Live Hidden Sandbox & Virtual Canvas */
    #test-sandbox-iframe {
      position: fixed;
      top: -99999px;
      left: -99999px;
      width: 1280px;
      height: 1024px;
      visibility: hidden;
    }
    #preview-canvas-holder {
      position: fixed;
      top: -99999px;
      left: -99999px;
      visibility: hidden;
    }
  </style>
</head>
<body data-theme="web-original" data-font="web-original">
  <div class="container">
    <header class="header">
      <div>
        <h1 class="title">🧪 Testovací Runner — Diagnostika Sazby & Stylů</h1>
        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">
          Automatické ověření 3-fázového sazebního cyklu (Extrakce tokenů &rarr; Fontová připravenost &rarr; Živý tiskový Canvas)
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="inspector.html" class="btn btn-outline">
          <span>🔍 Otevřít Inspektor</span>
        </a>
        <a href="index.html" class="btn btn-outline">
          <span>📄 Otevřít Studio</span>
        </a>
        <button class="btn" id="btn-run-all" onclick="runAutomatedTests()">
          <span>▶ Spustit Všechny Testy</span>
        </button>
      </div>
    </header>

    <div class="summary-cards">
      <div class="stat-card">
        <div style="font-size: 12px; color: var(--text-muted); font-weight: 600;">CELKEM TESTŮ</div>
        <div class="stat-val" id="stat-total" style="color: var(--primary);">0</div>
      </div>
      <div class="stat-card">
        <div style="font-size: 12px; color: var(--text-muted); font-weight: 600;">ÚSPĚŠNĚ</div>
        <div class="stat-val" id="stat-pass" style="color: var(--success);">0</div>
      </div>
      <div class="stat-card">
        <div style="font-size: 12px; color: var(--text-muted); font-weight: 600;">SELHALO</div>
        <div class="stat-val" id="stat-fail" style="color: var(--fail);">0</div>
      </div>
      <div class="stat-card">
        <div style="font-size: 12px; color: var(--text-muted); font-weight: 600;">ČAS BĚHU</div>
        <div class="stat-val" id="stat-time" style="color: var(--warn);">0 s</div>
      </div>
    </div>

    <!-- Category Filter Bar -->
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-cat="all" onclick="filterCategory('all', this)">🌐 Všechny stránky (<span id="count-all">0</span>)</button>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Test List -->
    <div class="test-list" id="test-list"></div>

    <!-- Live Execution Logs -->
    <div style="margin-top: 24px;">
      <h3 style="font-size: 14px; font-weight: 700; margin-bottom: 8px;">📋 Souhrnný systémový protokol:</h3>
      <pre id="summary-log" style="background: #090d16; border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #94a3b8; max-height: 240px; overflow-y: auto;"></pre>
    </div>
  </div>

  <!-- Hidden Test Elements -->
  <iframe id="test-sandbox-iframe"></iframe>
  <div id="preview-canvas-holder">
    <div id="preview-canvas" class="doc-page" data-theme="web-original"></div>
  </div>

  <!-- Scripts -->
  <script src="js/readability.js"></script>
  <script src="js/global_benchmarks.js"></script>
  <script src="js/app.js"></script>
  <script>
    let activeFilter = 'all';
    let currentTests = [];
    let passCount = 0;
    let failCount = 0;
    let startTime = 0;
    let isRunning = false;

    function initFiltersAndList() {
      if (typeof GlobalBenchmarkRegistry === 'undefined') {
        document.getElementById('summary-log').textContent = 'CHYBA: GlobalBenchmarkRegistry není načten!';
        return;
      }

      const all = GlobalBenchmarkRegistry.getAll();
      const cats = GlobalBenchmarkRegistry.getCategories();
      const filterBar = document.getElementById('filter-bar');
      document.getElementById('count-all').textContent = all.length;

      filterBar.innerHTML = `<button class="filter-btn active" data-cat="all" onclick="filterCategory('all', this)">🌐 Všechny stránky (${all.length})</button>`;

      cats.forEach(c => {
        const count = all.filter(b => b.category === c.key).length;
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.setAttribute('data-cat', c.key);
        btn.textContent = `${c.name} (${count})`;
        btn.onclick = () => filterCategory(c.key, btn);
        filterBar.appendChild(btn);
      });

      renderTestList();
    }

    function filterCategory(catKey, btnEl) {
      activeFilter = catKey;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderTestList();
    }

    function renderTestList() {
      const container = document.getElementById('test-list');
      container.innerHTML = '';
      currentTests = GlobalBenchmarkRegistry.getByCategory(activeFilter);
      document.getElementById('stat-total').textContent = currentTests.length;

      currentTests.forEach(test => {
        const card = document.createElement('div');
        card.className = 'test-card';
        card.id = `card-${test.id}`;

        const tokens = test.styleTokens || {};
        const brandColor = tokens.brandColor || '#0ea5e9';
        const headColor = tokens.h1Color || tokens.headingColor || '#ffffff';
        const pColor = tokens.pColor || '#cccccc';
        const lightBg = tokens.lightBg || '#f8fafc';
        const headFont = (tokens.headingFont || 'System Serif').split(',')[0].replace(/['"]/g, '');
        const bodyFont = (tokens.bodyFont || 'System Sans').split(',')[0].replace(/['"]/g, '');

        card.innerHTML = `
          <div class="test-header-row">
            <div class="test-info">
              <div class="test-name">
                <span>${test.title}</span>
                <span class="test-cat">${test.categoryName || test.category}</span>
              </div>
              <a href="${test.sourceUrl}" target="_blank" rel="noopener" class="test-url-link" title="Otevřít původní stránku">
                🔗 ${test.sourceUrl} ↗
              </a>
            </div>
            <div class="test-actions-col">
              <div class="test-status status-idle" id="status-${test.id}">ČEKÁ</div>
              <div style="display: flex; gap: 6px;">
                <button class="btn btn-outline btn-sm" onclick="runSingleTest('${test.id}')" title="Rychlá offline validace fontů a stylů">▶ Offline</button>
                <button class="btn btn-primary btn-sm" onclick="runLiveTest('${test.id}')" title="Stáhnout a extrahovat živý článek přímo z internetu">🌐 Živě z URL</button>
              </div>
            </div>
          </div>

          <!-- Compact Visual Styles Box -->
          <div class="test-styles-preview" id="styles-preview-${test.id}">
            <div class="style-swatches-group">
              <div class="swatch-item" title="Brand / Akcent barva">
                <span class="swatch-box" style="background: ${brandColor};"></span>
                <span>Brand: <strong style="color: ${brandColor}; font-family: monospace;">${brandColor}</strong></span>
              </div>
              <div class="swatch-item" title="Barva nadpisů">
                <span class="swatch-box" style="background: ${headColor};"></span>
                <span>Head: <strong style="font-family: monospace;">${headColor}</strong></span>
              </div>
              <div class="swatch-item" title="Barva textu">
                <span class="swatch-box" style="background: ${pColor};"></span>
                <span>Text: <strong style="font-family: monospace;">${pColor}</strong></span>
              </div>
              <div class="swatch-item" title="Pozadí papíru">
                <span class="swatch-box" style="background: ${lightBg}; border-color: #94a3b8;"></span>
                <span>Bg: <strong style="font-family: monospace;">${lightBg}</strong></span>
              </div>
            </div>

            <div class="font-previews-group">
              <div class="font-sample-pill" title="Písmo nadpisů: ${tokens.headingFont || ''}">
                <span class="font-sample-badge">H1</span>
                <span class="font-sample-text" style="font-family: ${tokens.headingFont || 'serif'};">Aa ${headFont}</span>
              </div>
              <div class="font-sample-pill" title="Písmo textu: ${tokens.bodyFont || ''}">
                <span class="font-sample-badge">P</span>
                <span class="font-sample-text" style="font-family: ${tokens.bodyFont || 'sans-serif'};">Aa ${bodyFont}</span>
              </div>
              <span class="meta-badge" id="meta-stats-${test.id}">Ověřit</span>
            </div>
          </div>

          <button class="test-details-btn" onclick="toggleDetails('${test.id}')">Zobrazit detail protokolu</button>
          <div class="test-log-output" id="log-${test.id}">Čeká na spuštění testu...</div>
        `;
        container.appendChild(card);
      });
    }

    function toggleDetails(id) {
      const log = document.getElementById(`log-${id}`);
      if (log) log.classList.toggle('show');
    }

    function setStatus(id, state, message, logDetails) {
      const card = document.getElementById(`card-${id}`);
      const status = document.getElementById(`status-${id}`);
      const log = document.getElementById(`log-${id}`);

      if (card) {
        card.classList.remove('pass', 'fail', 'running');
        if (state === 'pass') card.classList.add('pass');
        if (state === 'fail') card.classList.add('fail');
        if (state === 'running') card.classList.add('running');
      }

      if (status) {
        status.className = `test-status status-${state}`;
        status.textContent = state.toUpperCase();
      }

      if (log && logDetails) {
        log.textContent = logDetails;
      }
    }

    function updateVisualPreview(item, tokens, sanitized) {
      const previewEl = document.getElementById(`styles-preview-${item.id}`);
      if (!previewEl) return;

      const brandColor = tokens.brandColor || '#0ea5e9';
      const headColor = tokens.h1Color || tokens.headingColor || '#ffffff';
      const pColor = tokens.pColor || '#cccccc';
      const lightBg = tokens.lightBg || '#f8fafc';
      const headFont = (tokens.headingFont || 'Serif').split(',')[0].replace(/['"]/g, '');
      const bodyFont = (tokens.bodyFont || 'Sans').split(',')[0].replace(/['"]/g, '');

      // Check extracted content stats
      let pCount = 0;
      let hasLeadImg = false;
      const htmlStr = typeof sanitized === 'string' ? sanitized : (sanitized?.htmlContent || '');
      if (htmlStr) {
        const dummy = document.createElement('div');
        dummy.innerHTML = htmlStr;
        pCount = dummy.querySelectorAll('p').length;
        hasLeadImg = !!dummy.querySelector('.doc-lead-figure, figure img, img');
      }

      previewEl.innerHTML = `
        <div class="style-swatches-group">
          <div class="swatch-item" title="Brand / Akcent barva">
            <span class="swatch-box" style="background: ${brandColor};"></span>
            <span>Brand: <strong style="color: ${brandColor}; font-family: monospace;">${brandColor}</strong></span>
          </div>
          <div class="swatch-item" title="Barva nadpisů">
            <span class="swatch-box" style="background: ${headColor};"></span>
            <span>Head: <strong style="font-family: monospace;">${headColor}</strong></span>
          </div>
          <div class="swatch-item" title="Barva textu">
            <span class="swatch-box" style="background: ${pColor};"></span>
            <span>Text: <strong style="font-family: monospace;">${pColor}</strong></span>
          </div>
          <div class="swatch-item" title="Pozadí papíru">
            <span class="swatch-box" style="background: ${lightBg}; border-color: #94a3b8;"></span>
            <span>Bg: <strong style="font-family: monospace;">${lightBg}</strong></span>
          </div>
        </div>

        <div class="font-previews-group">
          <div class="font-sample-pill" title="Písmo nadpisů: ${tokens.headingFont || ''}">
            <span class="font-sample-badge">H1</span>
            <span class="font-sample-text" style="font-family: ${tokens.headingFont || 'serif'};">Aa ${headFont}</span>
          </div>
          <div class="font-sample-pill" title="Písmo textu: ${tokens.bodyFont || ''}">
            <span class="font-sample-badge">P</span>
            <span class="font-sample-text" style="font-family: ${tokens.bodyFont || 'sans-serif'};">Aa ${bodyFont}</span>
          </div>
          <span class="meta-badge">${pCount} odst. ${hasLeadImg ? '• 🖼️ Obrázek' : ''}</span>
        </div>
      `;
    }

    async function executeSingleTestItem(item) {
      setStatus(item.id, 'running', 'Probíhá validace...', 'Fáze 1..3 probíhá...');

      // FÁZE 1: Nativní obsahově-propojená extrakce
      const parser = new DOMParser();
      const doc = parser.parseFromString(item.rawHtml, 'text/html');
      
      const articleTitleEl = doc.querySelector('.c-article-title, .article__heading, .c-article-header__title, h1.entry-title, .entry-header h1, .mol-article-header__title, [data-dot="mol-article-title"], [itemprop="headline"], h1, title');
      const mainContainer = doc.querySelector('.c-article-body, .article__content, .article__body, .core-container, .body-content, .mol-article-content, [data-dot="mol-article-content"], [itemprop="articleBody"], .entry-content, .article-content, .paywall-article, .art-body, article, main');
      const articleContext = {
        mainContainer: mainContainer,
        articleTitleEl: articleTitleEl,
        storyParagraphs: mainContainer ? Array.from(mainContainer.querySelectorAll('p')).filter(p => p.textContent.trim().length > 10) : []
      };

      const tokens = ContentExtractor._extractWebTokens(doc, item.sourceUrl, articleContext);
      const sanitizedObj = ContentExtractor.sanitizeRawHTML(item.rawHtml, item.sourceUrl, true);
      const cleanHtml = typeof sanitizedObj === 'string' ? sanitizedObj : (sanitizedObj?.htmlContent || '');

      // STRICT CONTENT & INTERSTITIAL VALIDATION
      if (!cleanHtml || cleanHtml.length < 50) {
        throw new Error(`Příliš málo obsahu: Extrahováno pouze ${cleanHtml?.length || 0} znaků`);
      }

      const tempSanitized = document.createElement('div');
      tempSanitized.innerHTML = cleanHtml;
      const cleanPCount = tempSanitized.querySelectorAll('p').length;
      if (cleanPCount < 1 && !tempSanitized.querySelector('h1, h2, h3, table, figure')) {
        throw new Error(`Chybí odstavce článku: Extrahováno 0 odstavců`);
      }

      const textLower = tempSanitized.textContent.toLowerCase();
      if (textLower.includes('cookies must be enabled') || textLower.includes('please enable cookies') || textLower.includes('attention required! | cloudflare') || textLower.includes('access denied') || textLower.includes('403 forbidden')) {
        throw new Error(`Falešný obsah: Detekována cookie/bot chybová stránka namísto článku`);
      }

      // FÁZE 2: Fontová připravenost
      if (tokens.headingFont) ContentExtractor._ensureGoogleFontLoaded(tokens.headingFont);
      if (tokens.bodyFont) ContentExtractor._ensureGoogleFontLoaded(tokens.bodyFont);

      // STRICT ANTI-DEGRADATION ASSERTIONS
      const expHead = item.styleTokens?.headingFont || '';
      const expBody = item.styleTokens?.bodyFont || '';
      const cleanExpHead = expHead.split(',')[0].replace(/['"]/g, '').toLowerCase().trim();
      const cleanExpBody = expBody.split(',')[0].replace(/['"]/g, '').toLowerCase().trim();
      const cleanActHead = (tokens.headingFont || '').toLowerCase();
      const cleanActBody = (tokens.bodyFont || '').toLowerCase();

      const genericList = ['sans-serif', 'serif', 'arial', 'times new roman', 'system-ui', '-apple-system'];
      if (!genericList.includes(cleanExpHead) && genericList.includes(cleanActHead)) {
        throw new Error(`Degradace nadpisu do generického fallbacku: Očekáváno "${expHead}", ale detekováno "${tokens.headingFont}"`);
      }
      if (!genericList.includes(cleanExpBody) && genericList.includes(cleanActBody)) {
        throw new Error(`Degradace odstavce do generického fallbacku: Očekáváno "${expBody}", ale detekováno "${tokens.bodyFont}"`);
      }

      if (cleanExpHead && !cleanActHead.includes(cleanExpHead)) {
        throw new Error(`Heading font mismatch: Očekáváno "${expHead}" ale extrahováno "${tokens.headingFont}"`);
      }
      if (cleanExpBody && !cleanActBody.includes(cleanExpBody)) {
        throw new Error(`Body font mismatch: Očekáváno "${expBody}" ale extrahováno "${tokens.bodyFont}"`);
      }

      // FÁZE 3: Živý Canvas
      const canvas = document.getElementById('preview-canvas');
      canvas.innerHTML = `
        <h1 class="doc-element doc-h1" style="font-family: ${tokens.headingFont}; color: ${tokens.h1Color || tokens.headingColor};">${item.title}</h1>
        <p class="doc-element" style="font-family: ${tokens.bodyFont}; color: ${tokens.pColor};">Ukázkový text odstavce.</p>
      `;

      const compH1 = window.getComputedStyle(canvas.querySelector('h1'));
      const compP = window.getComputedStyle(canvas.querySelector('p'));

      const logMsg = `✅ FÁZE 1: Extrahováno autenticky (Brand: ${tokens.brandColor}, Head: ${tokens.headingFont}, Body: ${tokens.bodyFont})\n` +
                     `✅ FÁZE 2: Vektorové řezy a CSS proměnné synchronizovány\n` +
                     `✅ FÁZE 3: Vypočtený Canvas H1 font: "${compH1.fontFamily}", barva: ${compH1.color}\n` +
                     `✅ FÁZE 3: Vypočtený Canvas P font: "${compP.fontFamily}", barva: ${compP.color}`;

      setStatus(item.id, 'pass', 'OK', logMsg);
      updateVisualPreview(item, tokens, sanitizedObj);
      return { success: true, item, tokens };
    }

    async function runSingleTest(testId) {
      const item = GlobalBenchmarkRegistry.find(testId);
      if (!item) return;

      try {
        await executeSingleTestItem(item);
        document.getElementById('summary-log').textContent += `[PASS] ${item.id}: OK\n`;
      } catch (err) {
        setStatus(item.id, 'fail', 'CHYBA', `❌ Selhalo: ${err.message}`);
        document.getElementById('summary-log').textContent += `[FAIL] ${item.id}: ${err.message}\n`;
      }
    }

    async function runLiveTest(testId) {
      const item = GlobalBenchmarkRegistry.find(testId);
      if (!item) return;

      setStatus(item.id, 'running', 'Stahování...', `🌐 Připojuji se k živé adrese:\n${item.sourceUrl}\nProsím čekejte, probíhá stahování a extrakce...`);
      const logEl = document.getElementById(`log-${item.id}`);
      if (logEl) logEl.classList.add('show');

      try {
        const startTime = Date.now();
        const result = await ContentExtractor.fetchFromUrl(item.sourceUrl, true);
        const duration = ((Date.now() - startTime) / 1000).toFixed(2);

        if (!result) throw new Error('Nebyla získána žádná data ze vzdáleného serveru.');

        const htmlStr = typeof result === 'string' ? result : (result.htmlContent || '');
        const title = result.title || item.title || 'Bez názvu';
        const tokens = result.styleTokens || item.styleTokens || {};

        const dummy = document.createElement('div');
        dummy.innerHTML = htmlStr;
        const pCount = dummy.querySelectorAll('p').length;
        const imgCount = dummy.querySelectorAll('img').length;
        const hCount = dummy.querySelectorAll('h1, h2, h3, h4').length;

        if (pCount === 0 && htmlStr.length < 100) {
          throw new Error('Živá stránka vrátila prázdný nebo neúplný obsah (ochrana proti robotům nebo přihlašovací brána).');
        }

        if (tokens.headingFont) ContentExtractor._ensureGoogleFontLoaded(tokens.headingFont);
        if (tokens.bodyFont) ContentExtractor._ensureGoogleFontLoaded(tokens.bodyFont);

        const logMsg = `✅ ŽIVÉ STAŽENÍ ÚSPĚŠNÉ (${duration} s)\n` +
                       `🌐 Zdroj: ${item.sourceUrl}\n` +
                       `📄 Titulek: "${title}"\n` +
                       `📊 Extrahovaný obsah: ${pCount} odstavců, ${hCount} nadpisů, ${imgCount} obrázků (${htmlStr.length} znaků)\n` +
                       `🎨 Detekovaný Brand: ${tokens.brandColor || 'nezjištěn'}\n` +
                       `🎨 Detekovaný Font Nadpisů: ${tokens.headingFont || 'výchozí'}\n` +
                       `🎨 Detekovaný Font Textu: ${tokens.bodyFont || 'výchozí'}`;

        setStatus(item.id, 'pass', 'ŽIVĚ OK', logMsg);
        updateVisualPreview(item, tokens, result);
        document.getElementById('summary-log').textContent += `[LIVE PASS] ${item.id} (${duration}s): ${pCount} odst., "${title.slice(0, 40)}"\n`;
      } catch (err) {
        setStatus(item.id, 'fail', 'CHYBA ŽIVĚ', `❌ Živé stažení selhalo: ${err.message}\nZdroj: ${item.sourceUrl}`);
        document.getElementById('summary-log').textContent += `[LIVE FAIL] ${item.id}: ${err.message}\n`;
      }
    }

    async function runAutomatedTests() {
      if (isRunning) return;
      isRunning = true;
      passCount = 0;
      failCount = 0;
      startTime = Date.now();
      document.getElementById('stat-pass').textContent = '0';
      document.getElementById('stat-fail').textContent = '0';
      document.getElementById('summary-log').textContent = '';

      const btn = document.getElementById('btn-run-all');
      btn.disabled = true;
      btn.textContent = '⏳ Běží testy...';

      const timerId = setInterval(() => {
        const sec = Math.round((Date.now() - startTime) / 1000);
        document.getElementById('stat-time').textContent = `${sec} s`;
      }, 300);

      try {
        if (!currentTests || currentTests.length === 0) {
          if (typeof GlobalBenchmarkRegistry !== 'undefined') {
            currentTests = GlobalBenchmarkRegistry.getByCategory(activeFilter);
          }
        }
        const total = currentTests.length;

        for (let i = 0; i < total; i++) {
          const item = currentTests[i];
          try {
            await executeSingleTestItem(item);
            passCount++;
            const host = item.styleTokens?.sourceHost || item.id;
            document.getElementById('summary-log').textContent += `[PASS] ${item.id} (${host}): OK\n`;
          } catch (err) {
            setStatus(item.id, 'fail', 'CHYBA', `❌ Selhalo: ${err.message}`);
            failCount++;
            document.getElementById('summary-log').textContent += `[FAIL] ${item.id}: ${err.message}\n`;
          }

          document.getElementById('stat-pass').textContent = passCount;
          document.getElementById('stat-fail').textContent = failCount;
          const pct = Math.round(((i + 1) / total) * 100);
          document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        document.getElementById('summary-log').textContent += `\n=======================================================\nFINAL SUMMARY (${activeFilter}): ${passCount} / ${total} SITES PASSED (${failCount} FAILED) — ${Math.round((passCount / total) * 100)}% SUCCESS RATE\n=======================================================\n`;
      } catch (globalErr) {
        console.error('Chyba v běhu testů:', globalErr);
        document.getElementById('summary-log').textContent += `\n[KRITICKÁ CHYBA]: ${globalErr.message}\n`;
      } finally {
        clearInterval(timerId);
        const totalSec = Math.round((Date.now() - startTime) / 1000);
        document.getElementById('stat-time').textContent = `${totalSec} s`;
        btn.disabled = false;
        btn.textContent = '▶ Spustit Všechny Testy';
        isRunning = false;
      }
    }

    initFiltersAndList();
    runAutomatedTests();
  </script>
